name: macOS release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VORTEX-macOS-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
