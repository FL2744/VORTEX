name: Windows release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release to receive Windows downloads
        required: true
        default: v0.1.0
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m py_compile windows/vortex.py
      - name: Build and launch-test Windows app
        shell: pwsh
        run: ./windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VORTEX-Windows-x64
          path: |
            dist/VORTEX-Windows-x64.zip
            dist/VORTEX-Windows-x64.zip.sha256
      - name: Publish Windows download
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$env:RELEASE_TAG" dist/VORTEX-Windows-x64.zip dist/VORTEX-Windows-x64.zip.sha256 --clobber
